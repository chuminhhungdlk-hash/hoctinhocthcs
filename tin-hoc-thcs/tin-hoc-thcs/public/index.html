<script>const api=async(op,b={},sig)=>{const r=await fetch('/api/app',{method:'POST',headers:{'content-type':'application/json',...(S.tok?{authorization:'Bearer '+S.tok}:{})},body:JSON.stringify({op,...b}),signal:sig}),j=await r.json().catch(()=>({}));if(!r.ok)throw{code:j.e||'http_'+r.status};return j};
const SD={doc:p=>({get:async()=>p=='roster/main'?{exists:true,data:()=>({list:null}),...await api('classes').then(r=>({data:()=>({list:r.list})}))}:await api('mine').then(r=>({exists:true,data:()=>({a:r.a})})),set:d=>p=='roster/main'?api('setRoster',{list:d.list}):api('save',{list:d.a})}),collection:()=>({get:async()=>({docs:[{id:'all',data:()=>({a:[]}),...await api('results').then(r=>({data:()=>({a:r.a})}))}]})})};
const SAMPLE={json:async(p,o={})=>{let tm;if(o.onText){let n=0;tm=setInterval(()=>{n=Math.min(3300,n+60);o.onText({text:'x'.repeat(n)})},400)}try{const r=await api('ai',{prompt:p,tier:o.modelTier},o.signal);return JSON.parse(r.text.replace(/^[^\[{]*|[^\]}]*$/g,''))}catch(e){if(e.name=='AbortError')throw{code:'cancelled'};throw{code:e.code||'error'}}finally{clearInterval(tm)}}};
const DLS={save:async({filename,data})=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'text/csv;charset=utf-8'}));a.download=filename;document.body.append(a);a.click();a.remove()}};
window.claude={use:async n=>({db:SD,sample:SAMPLE,downloads:DLS,user:{id:async()=>null}})[n]||null};
</script>
<script>
const D={"6":[{"c":"1","n":"Máy tính và cộng đồng","e":"💻","u":[["Thông tin và dữ liệu","Bài 1",["Nhận biết được sự khác nhau giữa thông tin và dữ liệu.","Phân biệt được thông tin và vật mang tin.","Nêu được ví dụ minh hoạ mối quan hệ giữa thông tin và dữ liệu.","Nêu được ví dụ minh hoạ tầm quan trọng của thông tin."],["Thông tin: Là những gì đem lại hiểu biết cho con người về thế giới xung quanh và về chính bản thân mình.","Dữ liệu: Là thông tin được ghi lên vật mang tin dưới dạng chữ, số, hình ảnh, âm thanh,...","Vật mang tin: Phương tiện dùng để lưu trữ và truyền tải thông tin (giấy, thẻ nhớ, đĩa CD,...).","Thông tin đúng giúp con người đưa ra những lựa chọn tốt và hoạt động hiệu quả."]],["Xử lí thông tin","Bài 2",["Nêu được các hoạt động cơ bản trong xử lí thông tin.","Giải thích được máy tính là công cụ hiệu quả để xử lí thông tin.","Nêu được ví dụ minh hoạ cụ thể."],["4 hoạt động xử lí thông tin: Thu nhận thông tin -> Xử lí thông tin -> Lưu trữ thông tin -> Truyền thông tin.","Máy tính là công cụ xử lí thông tin hiệu quả: Nhờ khả năng tính toán tốc độ cao, chính xác, bền bỉ, lưu trữ dung lượng lớn và làm việc liên tục."]],["Thông tin trong máy tính","Bài 3",["Giải thích được việc có thể biểu diễn thông tin chỉ với hai kí hiệu 0 và 1.","Biết được bit là đơn vị nhỏ nhất trong lưu trữ thông tin.","Nêu được tên và độ lớn các đơn vị đo dung lượng thông tin.","Ước lượng được khả năng lưu trữ của các thiết bị nhớ thông dụng."],["Biểu diễn thông tin: Mọi thông tin trong máy tính (văn bản, hình ảnh, âm thanh, số,...) đều được chuyển đổi thành dãy bit (chỉ gồm hai kí hiệu 0 và 1).","Bit (Binary digit): Đơn vị đo nhỏ nhất của dung lượng thông tin.","Các đơn vị đo dung lượng: B (Byte), KB (Kilobyte), MB (Megabyte), GB (Gigabyte), TB (Terabyte). 1 Byte = 8 bits."]]]},{"c":"2","n":"Mạng máy tính và internet","e":"🌐","u":[["Mạng máy tính","Bài 4",["Nêu được mạng máy tính là gì và lợi ích của nó trong cuộc sống.","Kể tên được các thành phần chính của một mạng máy tính.","Nêu được ví dụ cụ thể về trường hợp mạng không dây tiện dụng hơn mạng có dây."],["Khái niệm: Hai hoặc nhiều máy tính và các thiết bị kết nối với nhau để truyền thông tin cho nhau tạo thành mạng máy tính.","Lợi ích: Liên lạc, trao đổi thông tin, chia sẻ dữ liệu và dùng chung thiết bị phần cứng (máy in, ổ cứng,...).","Thành phần chính: Thiết bị đầu cuối, thiết bị kết nối (Router, Switch, cáp mạng, sóng wifi,...), phần mềm mạng."]],["Internet","Bài 5",["Biết Internet là gì.","Nêu được một số đặc điểm chính của Internet.","Nêu được một số lợi ích chính của Internet."],["Khái niệm: Internet là mạng liên kết các mạng máy tính trên khắp thế giới.","Đặc điểm chính: Tính toàn cầu, tính tương tác, tính dễ tiếp cận, tính không chủ sở hữu, tính cập nhật, lưu trữ lớn, đa dạng và ẩn danh.","Lợi ích: Trao đổi thông tin nhanh chóng, học tập/làm việc trực tuyến, nguồn tài liệu phong phú, giải trí và cung cấp tiện ích cho đời sống."]]]},{"c":"3","n":"Tổ chức lưu trữ, tìm kiếm và trao đổi thông tin","e":"🔎","u":[["Mạng thông tin toàn cầu","Bài 6",["Trình bày sơ lược các khái niệm World Wide Web (WWW), website, địa chỉ website, trang chủ, trình duyệt.","Xem và nêu được các thông tin chính trên trang web cho trước.","Khai thác được thông tin trên một số trang web thông dụng."],["World Wide Web (WWW): Mạng thông tin toàn cầu, hệ thống các trang siêu văn bản liên kết với nhau trên Internet.","Trang web & Website: Trang web là trang siêu văn bản chứa văn bản, hình ảnh, âm thanh, liên kết. Website là tập hợp các trang web liên quan được truy cập qua một địa chỉ.","Trình duyệt web: Phần mềm giúp người dùng truy cập và khai thác thông tin trên WWW (Chrome, Edge, Firefox,...)."]],["Tìm kiếm thông tin trên Internet","Bài 7",["Nêu được công dụng của máy tìm kiếm.","Xác định được từ khoá ứng với mục đích tìm kiếm cho trước.","Thực hiện được việc tìm kiếm và khai thác thông tin trên Internet."],["Máy tìm kiếm (Search Engine): Trang web đặc biệt giúp tìm kiếm thông tin trên Internet theo từ khoá (Google, Bing, Yahoo,...).","Từ khoá (Keyword): Từ hoặc cụm từ thể hiện nội dung cần tìm kiếm. Đặt từ khoá trong dấu ngoặc kép `\"\"` để tìm kiếm chính xác cụm từ."]],["Thư điện tử","Bài 8",["Biết thư điện tử là gì; biết ưu/nhược điểm cơ bản của dịch vụ thư điện tử.","Biết tài khoản thư điện tử, hộp thư điện tử, thành phần địa chỉ thư điện tử.","Thực hiện đăng ký, đăng nhập, soạn, gửi, nhận thư điện tử."],["Thư điện tử (Email): Dịch vụ gửi và nhận thư qua mạng máy tính.","Cấu trúc địa chỉ Email: `<Tên người dùng>@<Tên nhà cung cấp dịch vụ>` (Ví dụ: `nguyenvana@gmail.com`).","Ưu điểm: Chi phí thấp, gửi/nhận tức thời, gửi đồng thời cho nhiều người, có thể đính kèm tệp tin."]]]},{"c":"4","n":"Đạo đức, pháp luật và văn hoá trong môi trường số","e":"⚖️","u":[["An toàn thông tin trên Internet","Bài 9",["Biết một số tác hại và nguy cơ khi sử dụng Internet, biện pháp phòng ngừa.","Trình bày được tầm quan trọng của an toàn thông tin cá nhân/tập thể.","Bảo vệ được thông tin cá nhân và tài khoản.","Nhận diện thông điệp lừa đảo/nội dung xấu."],["Nguy cơ trên Internet: Bị lộ thông tin cá nhân, nhiễm virus/mã độc, bị lừa đảo, bắt nạt trên mạng.","Tài khoản và Mật khẩu: Đặt mật khẩu mạnh (dài trên 8 kí tự, gồm chữ hoa, chữ thường, số và kí hiệu đặc biệt), không chia sẻ mật khẩu.","Quy tắc an toàn: Không truy cập liên kết lạ, không mở tệp đính kèm từ người không quen, bật phần mềm diệt virus."]]]},{"c":"5","n":"Ứng dụng tin học","e":"🧰","u":[["Sơ đồ tư duy","Bài 10",["Biết được sơ đồ tư duy là gì và tác dụng của nó.","Tạo được sơ đồ tư duy đơn giản bằng tay hoặc bằng phần mềm."],["Sơ đồ tư duy (Mind map): Phương pháp ghi chép trực quan, tóm tắt thông tin bằng cách kết hợp từ khoá, hình ảnh, màu sắc và các nhánh nối.","Ứng dụng: Hệ thống hoá kiến thức, lập kế hoạch, phát triển ý tưởng sáng tạo."]],["Định dạng văn bản","Bài 11",["Biết các định dạng văn bản cơ bản (phông chữ, cỡ chữ, kiểu chữ, màu chữ, căn lề đoạn văn).","Thực hiện được định dạng văn bản bằng phần mềm soạn thảo."],["Định dạng ký tự: Thay đổi phông chữ (Font), cỡ chữ (Size), kiểu chữ (Bold, Italic, Underline), màu chữ.","Định dạng đoạn văn: Căn lề (trái, phải, giữa, đều hai bên), khoảng cách dòng, khoảng cách giữa các đoạn."]],["Trình bày thông tin ở dạng bảng","Bài 12",["Trình bày được thông tin dưới dạng bảng.","Chèn, xoá, chỉnh sửa hàng/cột và định dạng bảng đơn giản."],["Bảng (Table): Giúp trình bày thông tin một cách cô đọng, rõ ràng, dễ so sánh và đối chiếu.","Thao tác: Chèn bảng, chèn/xoá hàng và cột, gộp ô, tách ô, định dạng viền và màu nền."]],["Thực hành: Tìm kiếm và thay thế","Bài 13",["Sử dụng được công cụ Tìm kiếm (Find) và Thay thế (Replace) trong phần mềm soạn thảo văn bản."],["Công cụ Find (`Ctrl + F`): Giúp tìm nhanh một từ hoặc cụm từ trong văn bản.","Công cụ Replace (`Ctrl + H`): Giúp tự động thay thế cụm từ tìm thấy bằng cụm từ mới một cách chính xác và tiết kiệm thời gian."]],["Thực hành tổng hợp: Hoàn thiện sổ lưu niệm","Bài 14",["Áp dụng tổng hợp kiến thức soạn thảo: chèn ảnh, tạo bảng, định dạng, tạo danh sách liệt kê để hoàn thiện sản phẩm."],["Vận dụng thực tế: Kết hợp định dạng văn bản, chèn hình ảnh minh hoạ, bảng biểu và sơ đồ tư duy để tạo sản phẩm số có tính thẩm mỹ và đáp ứng mục đích thực tiễn."]]]},{"c":"6","n":"Giải quyết vấn đề với sự trợ giúp của máy tính","e":"🧩","u":[["Thuật toán","Bài 15",["Nêu được khái niệm thuật toán.","Mô tả được thuật toán bằng ngôn ngữ tự nhiên và sơ đồ khối."],["Thuật toán (Algorithm): Dãy các thao tác chặt chẽ, xác định được sắp xếp theo một thứ tự xác định để giải quyết một bài toán/nhiệm vụ.","Biểu diễn thuật toán: Bằng ngôn ngữ tự nhiên hoặc sơ đồ khối (Hình elip: Bắt đầu/Kết thúc; Hình chữ nhật: Thao tác/Xử lí; Hình thoi: Điều kiện kiểm tra)."]],["Các cấu trúc điều khiển","Bài 16",["Nhận biết và mô tả được 3 cấu trúc điều khiển cơ bản: Tuần tự, Rẽ nhánh, Lặp."],["Cấu trúc tuần tự: Các bước thực hiện nối tiếp nhau theo thứ tự từ trên xuống dưới.","Cấu trúc rẽ nhánh (Nếu... thì...): Thực hiện công việc tuỳ thuộc vào điều kiện đúng hay sai.","Cấu trúc lặp: Thực hiện lặp đi lặp lại một số bước cho đến khi thoả mãn điều kiện dừng."]],["Chương trình máy tính","Bài 17",["Biết chương trình máy tính là gì.","Biết máy tính thực thi chương trình từng lệnh theo thứ tự."],["Chương trình máy tính: Tập hợp các lệnh viết bằng ngôn ngữ lập trình hướng dẫn máy tính thực hiện thuật toán.","Đặc điểm: Máy tính thực hiện các lệnh trong chương trình một cách tự động, nhanh chóng và chính xác."]]]}],"7":[{"c":"1","n":"Máy tính và cộng đồng","e":"💻","u":[["Thiết bị vào - ra","Bài 1",["Biết và nhận ra được các thiết bị vào - ra có nhiều loại, hình dạng khác nhau.","Biết chức năng của các thiết bị vào - ra trong thu nhận, lưu trữ, xử lí và truyền thông tin.","Thực hiện đúng thao tác với thiết bị thông dụng."],["Thiết bị vào (Input Devices): Dùng để nhập thông tin vào máy tính (Bàn phím, chuột, micro, máy quét, webcam,...).","Thiết bị ra (Output Devices): Dùng để xuất thông tin từ máy tính ra cho con người nhận biết (Màn hình, máy in, loa, tai nghe, máy chiếu,...).","Thao tác an toàn: Đọc kĩ hướng dẫn, kết nối đúng cổng, tắt máy đúng cách (`Shut down`)."]],["Phần mềm máy tính","Bài 2",["Giải thích được sơ lược chức năng điều khiển và quản lí của hệ điều hành.","Phân biệt được hệ điều hành với phần mềm ứng dụng.","Nêu được tên một số phần mềm ứng dụng đã sử dụng.","Giải thích được phần mở rộng của tên tệp."],["Hệ điều hành (OS): Quản lí và điều khiển hoạt động chung của máy tính, cung cấp môi trường chạy phần mềm ứng dụng (Windows, macOS, Linux, Android, iOS,...).","Phần mềm ứng dụng: Chương trình máy tính giúp người dùng thực hiện công việc cụ thể (Word, Excel, Scratch, Chrome,...).","Phần mở rộng tên tệp: Nhận biết loại tệp và phần mềm ứng dụng phù hợp (ví dụ: `.docx`, `.xlsx`, `.pptx`, `.jpg`, `.mp4`)."]],["Quản lí dữ liệu trong máy tính","Bài 3",["Thao tác thành thạo với tệp và thư mục: tạo, sao chép, di chuyển, đổi tên, xoá tệp và thư mục.","Biết tệp chương trình cũng là dữ liệu.","Nêu được ví dụ biện pháp bảo vệ dữ liệu (sao lưu, phòng chống virus)."],["Tệp và Thư mục: Đặt tên rõ ràng, dễ nhớ. Cây thư mục giúp quản lí dữ liệu ngăn nắp.","Bảo vệ dữ liệu: Sao lưu thường xuyên (sao lưu cục bộ trên ổ cứng ngoài/USB và sao lưu từ xa trên đám mây); Đặt mật khẩu tài khoản; Dùng phần mềm diệt virus."]]]},{"c":"2","n":"Tổ chức lưu trữ, tìm kiếm và trao đổi thông tin","e":"🔎","u":[["Mạng xã hội và một số kênh trao đổi thông tin trên Internet","Bài 4",["Nêu được tên một số kênh trao đổi thông tin thông dụng trên Internet.","Nêu được chức năng cơ bản của mạng xã hội.","Sử dụng được một số chức năng cơ bản của mạng xã hội để giao lưu, chia sẻ thông tin.","Nêu được ví dụ hậu quả của việc sử dụng thông tin vào mục đích sai trái."],["Kênh trao đổi thông tin: Thư điện tử, diễn đàn, mạng xã hội (Facebook, Zalo, YouTube, Instagram,...).","Mạng xã hội: Cộng đồng trực tuyến kết nối người dùng, chia sẻ bài viết, hình ảnh, video.","Lưu ý: Mạng xã hội có tính hai mặt. Cần cân nhắc kĩ trước khi chia sẻ thông tin, tôn trọng pháp luật và quy định độ tuổi."]],["Ứng xử trên mạng","Bài 5",["Nêu được một số nét văn hoá, hợp pháp khi giao tiếp qua mạng.","Nhận biết được một số hành vi ứng xử thiếu văn hoá, vi phạm pháp luật.","Biết phòng tránh các nguy cơ khi ứng xử trên mạng."],["Giao tiếp văn minh: Sử dụng ngôn ngữ lịch sự, tôn trọng ý kiến khác biệt, không đăng tải thông tin sai sự thật hoặc bôi nhọ người khác.","Tôn trọng bản quyền: Không tự ý sao chép, phát tán sản phẩm số của người khác khi chưa được phép."]]]},{"c":"3","n":"Đạo đức, pháp luật và văn hoá trong môi trường số","e":"⚖️","u":[["Tương tác an toàn trên mạng","Bài 6",["Nêu được một số quy tắc an toàn khi tương tác trên mạng.","Nhận diện được các nguy cơ mất an toàn thông tin khi tương tác trực tuyến."],["Nguy cơ trực tuyến: Lừa đảo, bị đánh cắp tài khoản, lộ vị trí cá nhân, bắt nạt trên mạng.","Quy tắc an toàn: Không chia sẻ thông tin cá nhân/mật khẩu với người lạ, không gặp mặt người quen qua mạng mà không có cha mẹ đồng ý."]]]},{"c":"4","n":"Ứng dụng tin học","e":"🧰","u":[["Tính toán tự động trên trang tính","Bài 7",["Nhận biết được màn hình làm việc của phần mềm bảng tính.","Khái niệm ô tính, hàng, cột, địa chỉ ô.","Nhập dữ liệu và công thức tính toán đơn giản."],["Phần mềm bảng tính: Công cụ xử lí dữ liệu dạng bảng, tự động tính toán theo công thức.","Địa chỉ ô: Tên cột + Tên hàng (Ví dụ: `A1`, `C5`).","Công thức: Bắt đầu bằng dấu `=` và chứa các phép toán `+`, `-`, `*`, `/`."]],["Sử dụng các hàm đơn giản","Bài 8",["Hiểu được mục đích của việc sử dụng hàm trong bảng tính.","Sử dụng được các hàm tính toán cơ bản: SUM, AVERAGE, MAX, MIN, COUNT."],["Hàm tính toán: Công thức xây dựng sẵn giúp tính toán nhanh chóng.","`SUM`: Tính tổng; `AVERAGE`: Tính trung bình;","`MAX`/`MIN`: Giá trị lớn nhất/nhỏ nhất; `COUNT`: Đếm số ô dữ liệu số."]],["Định dạng trang tính","Bài 9",["Thực hiện được các thao tác định dạng dữ liệu trong ô tính (chữ, số, căn lề, kẻ đường biên, tô màu nền)."],["Định dạng ô tính: Thay đổi phông chữ, kiểu chữ, màu sắc, căn lề.","Kẻ bảng: Kẻ đường biên (Borders), tô màu nền (Fill Color) và gộp ô (`Merge & Center`)."]],["Thao tác trên trang tính","Bài 10",["Thực hiện được thao tác chèn, xoá, ẩn/hiện hàng và cột.","Đổi tên, chèn, xoá, sao chép trang tính."],["Thao tác cấu trúc: Chèn/xoá hàng, cột, thay đổi độ rộng cột và chiều cao hàng.","Quản lí trang tính (Sheet): Đổi tên trang tính, thêm trang tính mới, di chuyển hoặc sao chép trang tính."]],["Tạo bài trình chiếu","Bài 11",["Nhận biết được một số phần mềm trình chiếu.","Tạo được bài trình chiếu đơn giản có tiêu đề và nội dung."],["Bài trình chiếu: Gồm tập hợp các trang chiếu (Slide) dùng để thuyết trình.","Cấu trúc: Trang tiêu đề (Title Slide) và các trang nội dung (Content Slides)."]],["Định dạng đối tượng trên trang chiếu","Bài 12",["Định dạng được văn bản, chèn và chỉnh sửa hình ảnh, sơ đồ trên trang chiếu.","Áp dụng hiệu ứng chuyển trang và hiệu ứng đối tượng."],["Định dạng trang chiếu: Chèn hộp văn bản (Text Box), hình ảnh (Picture), hình khối (Shapes).","Hiệu ứng: Hiệu ứng chuyển trang chiếu (Transitions) và hiệu ứng cho đối tượng (Animations)."]],["Thuật toán tìm kiếm nhị phân","Bài 13",["Giải thích được thuật toán tìm kiếm nhị phân.","Biểu diễn và thực hiện được thuật toán tìm kiếm nhị phân trên danh sách đã sắp xếp."],["Điều kiện tìm kiếm nhị phân: Dữ liệu ĐÃ ĐƯỢC SẮP XẾP.","Thao tác: Chia đôi danh sách, so sánh giá trị cần tìm với phần tử ở giữa để thu hẹp phạm vi tìm kiếm sang nửa trước hoặc nửa sau."]]]},{"c":"5","n":"Giải quyết vấn đề với sự trợ giúp của máy tính","e":"🧩","u":[["Thuật toán sắp xếp","Bài 14",["Hiểu và mô tả được các thuật toán sắp xếp đơn giản (sắp xếp nổi bọt, sắp xếp lựa chọn)."],["Sắp xếp nổi bọt: So sánh và đổi chỗ các cặp phần tử liền kề sai thứ tự.","Sắp xếp lựa chọn: Chọn phần tử nhỏ nhất (hoặc lớn nhất) chưa sắp xếp và đưa về vị trí đúng."]],["Thực hành tổng hợp: Tạo sản phẩm số","Bài 15",["Tạo được một sản phẩm số hoàn chỉnh (bài trình chiếu, trang tính, văn bản) giải quyết nhiệm vụ thực tế."],["Vận dụng: Kết hợp bảng tính, thiết kế trình chiếu và tư duy thuật toán để hoàn thành dự án báo cáo nhóm."]],["Lập trình máy tính","Bài 16",["Làm quen với môi trường lập trình trực quan (như Scratch).","Viết được chương trình đơn giản thể hiện cấu trúc điều khiển."],["Lập trình trực quan: Kéo thả và lắp ghép các khối lệnh để điều khiển nhân vật thực hiện kịch bản hoạt hình hoặc trò chơi đơn giản."]]]}],"8":[{"c":"1","n":"Máy tính và cộng đồng","e":"💻","u":[["Lược sử công cụ tính toán","Bài 1",["Tóm tắt được lịch sử phát triển của công cụ tính toán từ cơ học đến điện tử.","Nêu được đặc điểm chính của các thế hệ máy tính điện tử.","Hiểu được máy tính đã làm thay đổi thế giới như thế nào."],["Cụm máy tính cơ học: Bàn tính, máy tính Pascaline (1642), máy Analytical Engine (1833 - Charles Babbage).","5 thế hệ máy tính điện tử: Thế hệ 1 (Đèn điện tử), Thế hệ 2 (Bóng bán dẫn), Thế hệ 3 (Mạch tích hợp IC), Thế hệ 4 (Mạch VLSI, vi xử lí), Thế hệ 5 (Mạch ULSI, Trí tuệ nhân tạo AI)."]]]},{"c":"2","n":"Tổ chức lưu trữ, tìm kiếm và trao đổi thông tin","e":"🔎","u":[["Thông tin trong môi trường số","Bài 2",["Nêu được các đặc điểm của thông tin số.","Trình bày được tầm quan trọng của việc biết khai thác nguồn thông tin đáng tin cậy."],["Đặc điểm thông tin số: Dễ dàng nhân bản và lan truyền, dung lượng lưu trữ khổng lồ, truy cập từ xa, khó xoá bỏ hoàn toàn.","Đánh giá nguồn tin: Kiểm tra nguồn trích dẫn, phân biệt ý kiến và sự kiện, kiểm tra chứng cứ và tính thời sự của thông tin."]],["Thực hành: Khai thác thông tin số","Bài 3",["Sử dụng được công cụ tìm kiếm, xử lí và trao đổi thông tin trong môi trường số.","Đánh giá được lợi ích của thông tin tìm được."],["Thực hành: Sử dụng các từ khoá tìm kiếm chính xác, đánh giá độ tin cậy của thông tin thu thập được để phục vụ lập kịch bản/báo cáo dự án."]]]},{"c":"3","n":"Đạo đức, pháp luật và văn hoá trong môi trường số","e":"⚖️","u":[["Đạo đức và văn hoá trong sử dụng công nghệ kĩ thuật số","Bài 4",["Nhận biết và giải thích được một số biểu hiện vi phạm đạo đức và pháp luật, thiếu văn hoá khi sử dụng công nghệ số.","Bảo đảm sản phẩm số do bản thân tạo ra thể hiện được đạo đức và văn hoá."],["Hành vi vi phạm: Quay phim/chụp ảnh nơi cấm, tự ý phát tán thông tin riêng tư của người khác, bẻ khoá phần mềm, vi phạm bản quyền.","Tuân thủ quy định: Chỉ sử dụng sản phẩm số có bản quyền hoặc khi được sự cho phép của tác giả; ghi rõ nguồn trích dẫn."]]]},{"c":"4","n":"Ứng dụng tin học","e":"🧰","u":[["Sử dụng bảng tính giải quyết bài toán thực tế","Bài 5",["Giải thích được sự thay đổi địa chỉ tương đối trong công thức khi sao chép công thức.","Giải thích được sự khác nhau giữa địa chỉ tương đối và địa chỉ tuyệt đối."],["Địa chỉ tương đối (`C4`): Tự động thay đổi vị trí tương đối khi sao chép công thức.","Địa chỉ tuyệt đối (`$F$2`): Không thay đổi khi sao chép công thức (sử dụng dấu `$` hoặc phím `F4`)."]],["Sắp xếp và lọc dữ liệu","Bài 6",["Nêu được một số tình huống thực tế cần sử dụng chức năng sắp xếp và lọc dữ liệu.","Thực hiện được các thao tác sắp xếp và lọc dữ liệu trên bảng tính."],["Sắp xếp (`Data` -> `Sort`): Hoán đổi vị trí các hàng để thứ tự dữ liệu tăng dần hoặc giảm dần theo một/nhiều tiêu chí.","Lọc dữ liệu (`Data` -> `Filter`): Chọn và chỉ hiển thị các hàng thoả mãn điều kiện cho trước."]],["Trình bày dữ liệu bằng biểu đồ","Bài 7",["Nêu được một số tình huống thực tế cần sử dụng biểu đồ.","Thực hiện được các thao tác tạo biểu đồ của phần mềm bảng tính."],["Biểu đồ cột: So sánh dữ liệu giữa các danh mục.","Biểu đồ đoạn thẳng: Mô tả xu hướng thay đổi dữ liệu theo thời gian.","Biểu đồ quạt tròn: Biểu diễn tỉ lệ phần trăm của các phần so với tổng thể."]]]},{"c":"A","n":"Soạn thảo văn bản và trình chiếu nâng cao","e":"📝","lc":1,"u":[["Làm việc với danh sách dạng liệt kê và hình ảnh trong văn bản","Bài 8a",["Tạo danh sách dạng liệt kê.","Chèn, xoá, co giãn hình ảnh, vẽ hình đồ hoạ trong văn bản."],["Danh sách liệt kê: Tự động tạo danh sách dấu đầu dòng (Bullets) hoặc thứ tự (Numbering).","Hình ảnh: Chèn hình ảnh, hình khối (`Shapes`), điều chỉnh kích thước và định dạng ngắt dòng xung quanh ảnh (`Wrap Text`)."]],["Tạo đầu trang, chân trang cho văn bản","Bài 9a",["Thực hiện được các thao tác: đánh số trang, thêm đầu trang (Header) và chân trang (Footer)."],["Header & Footer: Phần nội dung lề trên và lề dưới tự động lặp lại ở mọi trang văn bản.","Page Number: Tự động đánh số trang văn bản."]],["Định dạng nâng cao cho trang chiếu","Bài 10a",["Chọn đặt được màu sắc, cỡ chữ hài hoà và hợp lí với nội dung.","Đánh số trang, thêm đầu trang và chân trang vào trang chiếu."],["Phối màu trang chiếu: Tương phản cao giữa chữ và nền, chọn màu phù hợp nội dung.","Trang trí trang chiếu: Thêm số trang, thông tin chân trang chiếu."]],["Sử dụng bản mẫu tạo bài trình chiếu","Bài 11a",["Sử dụng được các bản mẫu (Template) có sẵn để tạo bài trình chiếu chuyên nghiệp."],["Bản mẫu (Template): Mẫu thiết kế sẵn giúp tạo bài thuyết trình đẹp mắt, nhất quán về phông chữ và bố cục."]]]},{"c":"B","n":"Làm quen với phần mềm chỉnh sửa ảnh","e":"🖼️","lc":1,"u":[["Phần mềm chỉnh sửa ảnh","Bài 8b",["Nhận biết được giao diện và chức năng cơ bản của phần mềm chỉnh sửa ảnh (GIMP)."],["Giao diện GIMP: Vùng làm việc, các công cụ chọn vùng, tô màu, vẽ và chỉnh sửa ảnh."]],["Thay đổi khung hình, kích thước ảnh","Bài 9b",["Thực hiện được thao tác cắt ảnh (Crop), xoay ảnh, thay đổi kích thước và độ phân giải ảnh."],["Cắt ảnh (Crop): Loại bỏ phần ảnh không cần thiết.","Đổi kích thước: Thay đổi độ phân giải và kích thước tệp ảnh."]],["Thêm văn bản, tạo hiệu ứng cho ảnh","Bài 10b",["Chèn được văn bản vào ảnh, áp dụng các bộ lọc hiệu ứng đơn giản."],["Chèn chữ & Hiệu ứng: Thêm văn bản lên ảnh và áp dụng các bộ lọc hiệu ứng (Filter)."]],["Thực hành tổng hợp","Bài 11b",["Hoàn thiện một sản phẩm chỉnh sửa ảnh tổng hợp phục vụ dự án thực tế."],["Kết hợp cắt, chỉnh màu, ghép ảnh và thêm chữ để thiết kế banner/poster."]]]},{"c":"5","n":"Giải quyết vấn đề với sự trợ giúp của máy tính","e":"🧩","u":[["Từ thuật toán đến chương trình","Bài 12",["Hiểu được mối liên hệ giữa thuật toán và chương trình.","Viết được chương trình đơn giản mô tả thuật toán."],["Thuật toán -> Chương trình: Chương trình thể hiện thuật toán bằng ngôn ngữ lập trình cụ thể để máy tính chạy."]],["Biểu diễn dữ liệu","Bài 13",["Hiểu được khái niệm biến, kiểu dữ liệu (số, xâu kí tự, lôgic) trong chương trình."],["Biến (Variable): Đại lượng lưu trữ dữ liệu có thể thay đổi.","Kiểu dữ liệu: Số nguyên, số thực, xâu kí tự, kiểu Logic (`True`/`False`)."]],["Cấu trúc điều khiển","Bài 14",["Sử dụng được câu lệnh rẽ nhánh và câu lệnh lặp trong chương trình."],["Lệnh rẽ nhánh: `Nếu ... thì ...` (`If...then`).","Lệnh lặp: Lặp với số lần biết trước hoặc lặp có điều kiện."]],["Gỡ lỗi","Bài 15",["Nhận biết được lỗi cú pháp và lỗi logic trong chương trình.","Thực hiện được các thao tác tìm và gỡ lỗi (Debugging)."],["Lỗi cú pháp: Viết sai quy tắc câu lệnh.","Lỗi logic: Thuật toán sai dẫn đến kết quả sai. Kiểm tra bằng cách chạy từng lệnh (step-by-step)."]]]},{"c":"6","n":"Hướng nghiệp với tin học","e":"🎯","u":[["Tin học với nghề nghiệp","Bài 16",["Nêu được tác động của Tin học đối với các nghề nghiệp trong xã hội.","Biết được một số nghề thuộc lĩnh vực CNTT."],["Định hướng nghề nghiệp: Tin học ứng dụng trong mọi ngành nghề. Các nghề CNTT phổ biến: Lập trình viên, quản trị mạng, thiết kế đồ hoạ, an toàn thông tin."]]]}],"9":[{"c":"1","n":"Máy tính và cộng đồng","e":"💻","u":[["Thế giới kĩ thuật số","Bài 1",["Nhận biết sự có mặt của các thiết bị có gắn bộ vi xử lí ở khắp nơi.","Nêu được khả năng của máy tính và ứng dụng thực tế.","Giải thích tác động của CNTT lên giáo dục và xã hội."],["Bộ vi xử lí: Xuất hiện trong tivi thông minh, máy giặt, ô tô tự lái, robot, máy ATM,...","Khả năng máy tính: Tính toán tốc độ hàng tỉ phép tính/giây, lưu trữ lớn, kết nối toàn cầu.","Tác động: Mở rộng không gian và thời gian học tập, chia sẻ tri thức xã hội."]]]},{"c":"2","n":"Tổ chức lưu trữ, tìm kiếm và trao đổi thông tin","e":"🔎","u":[["Thông tin trong giải quyết vấn đề","Bài 2",["Giải thích được sự cần thiết phải quan tâm đến chất lượng thông tin.","Giải thích 4 tiêu chí đánh giá chất lượng thông tin."],["4 tiêu chí đánh giá chất lượng thông tin:","1. *Tính mới*: Được cập nhật gần nhất.","2. *Tính chính xác*: Đúng sự thật, có thể kiểm chứng.","3. *Tính đầy đủ*: Bao quát các khía cạnh cần thiết.","4. *Tính sử dụng được*: Phù hợp mục đích cần giải quyết."]],["Thực hành: Đánh giá chất lượng thông tin","Bài 3",["Tìm kiếm thông tin giải quyết vấn đề thực tế.","Đánh giá chất lượng thông tin để đưa ra quyết định."],["Thực hành: Xác định mục tiêu tìm kiếm, lọc thông tin theo 4 tiêu chí chất lượng và đưa ra danh sách lựa chọn tối ưu."]]]},{"c":"3","n":"Đạo đức, pháp luật và văn hoá trong môi trường số","e":"⚖️","u":[["Một số vấn đề pháp lí về sử dụng dịch vụ Internet","Bài 4",["Trình bày được một số tác động tiêu cực của công nghệ số.","Nêu các quy định pháp lí về sử dụng dịch vụ Internet và quyền sở hữu.","Nêu
